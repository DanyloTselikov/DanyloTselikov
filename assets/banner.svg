<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Dany Tselikov — Python developer</title>
  <desc id="desc">Dark navy profile banner with teal and blue accents and geometric code-inspired artwork.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152941"/>
    </linearGradient>
