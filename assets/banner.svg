    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" fill="none" stroke="#a5cced" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
