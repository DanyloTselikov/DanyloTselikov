    <circle cx="1010" cy="160" r="101" fill="none" stroke="#59b4d8" stroke-opacity=".14"/>
    <path d="M 820 0 V 320" stroke="#6bbfd0" stroke-opacity=".13"/>
    <path d="M 904 87 L 859 132 L 904 177 M 1133 87 L 1178 132 L 1133 177" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 1051 70 L 976 196" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
    <rect x="66" y="46" width="11" height="11" rx="3" fill="#42ddbd"/>
