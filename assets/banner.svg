    <text x="63" y="148" fill="#f6fbff" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-weight="700">Dany Tselikov</text>
    <text x="66" y="196" fill="#c7d7e9" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">Python developer in progress</text>
